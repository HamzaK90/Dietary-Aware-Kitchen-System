# Cucumber configuration for the JUnit 5 platform engine.
#
# Replaces the @CucumberOptions annotation on the old JUnit 4 runner, which pointed at
# features = "use_cases" - a path relative to the working directory rather than a classpath
# resource, so the suite only worked when launched from the project root.

cucumber.glue=com.cookmgmt.bdd
cucumber.plugin=pretty, summary, html:target/cucumber/report.html, json:target/cucumber/report.json
cucumber.publish.quiet=true

# Fail the build if a scenario has a step with no matching step definition, instead of
# reporting it as skipped and passing anyway.
cucumber.execution.strict=true
